name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Matrix.sln
      - run: dotnet build Matrix.sln --no-restore --configuration Release
      - run: dotnet test Matrix.sln --no-build --configuration Release
