<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matrix – Zweiter Bildschirm</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0f172a;color:#f8fafc}*{box-sizing:border-box}body{margin:0;padding:22px}button,input,a{font:inherit;border-radius:8px;padding:10px 14px}button,input{border:1px solid #64748b;color:white;background:#1e293b}button{cursor:pointer}a{color:#cbd5e1}header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px}header h1{font-size:20px;margin:0}#connection{color:#cbd5e1;font-size:14px}#login{padding:30px;max-width:580px;margin:10vh auto;background:#1e293b;border-radius:18px}#login input{max-width:100%;margin:10px 0}#stage{display:grid;grid-template-columns:3fr 2fr;gap:30px;height:calc(100dvh - 106px);min-height:250px}.wall{display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}canvas{width:100%;height:100%;object-fit:contain}aside{display:flex;flex-direction:column;justify-content:center;min-height:0;gap:14px}#photoBox{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}#photo{width:100%;height:100%;object-fit:contain}#placeholder{position:absolute;color:#cbd5e1}#coordinate{font-size:clamp(42px,7vw,100px);line-height:1;font-weight:750}#remaining{font-size:clamp(22px,3vw,42px);font-weight:650}#position{color:#cbd5e1;font-size:clamp(15px,1.5vw,24px)}#message{color:#fbbf24}body:fullscreen{padding:22px}body:fullscreen header{opacity:.12}body:fullscreen header:hover,body:fullscreen header:focus-within{opacity:1}[hidden]{display:none!important}@media(max-width:700px) and (orientation:portrait){#stage{grid-template-columns:1fr;height:auto;gap:20px}.wall{height:42vh}#photoBox{height:32vh;flex:auto}header{flex-wrap:wrap}#coordinate{font-size:50px}}
</style></head><body>
<header><div><h1>Matrix · Präsentation</h1><span id="connection">Bitte verbinden</span></div><div><a href="/" target="_blank" rel="noopener">Steuerung</a><button id="fullscreen">Vollbild</button></div></header>
<form id="login"><h2>Zweiten Bildschirm verbinden</h2><label>Zugangscode vom Fotobox-Rechner<br><input id="code" autocomplete="off" autocapitalize="characters" required maxlength="30"></label><button>Verbinden</button><p id="message" role="status"></p></form>
<main id="stage" hidden><section class="wall"><canvas id="wall" width="1200" height="800" aria-label="Mosaik mit aktuell markiertem Feld"></canvas></section><aside><div id="photoBox"><span id="placeholder">Warte auf das erste Foto</span><img id="photo" alt="Aktuelle Fotokachel" hidden></div><div id="remaining"></div><div id="coordinate">Bereit</div><div id="position"></div></aside></main>
<script>
const $=id=>document.getElementById(id);
let token=sessionStorage.getItem('matrixToken')||'',state=null,project=null,epoch=0,master=null,tiles=new Map(),loadingTiles=false,current=null,currentUrl=null,loadingCurrent=null;
function clear(){epoch++;if(master)URL.revokeObjectURL(master.url);master=null;for(const tile of tiles.values())URL.revokeObjectURL(tile.url);tiles.clear();if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=null;current=null;loadingCurrent=null;$('photo').hidden=true;$('photo').removeAttribute('src')}
async function api(path,options={}){const response=await fetch(path,{...options,cache:'no-store',signal:AbortSignal.timeout(12000),headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...options.headers}});if(response.status===401){token='';sessionStorage.removeItem('matrixToken');clear();$('login').hidden=false;$('stage').hidden=true;throw Error('Bitte erneut mit dem Zugangscode verbinden.')}if(!response.ok)throw Error('Verbindung nicht erreichbar ('+response.status+').');return response}
$('login').onsubmit=async event=>{event.preventDefault();try{const response=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('code').value})});if(!response.ok)throw Error(response.status===429?'Bitte eine Minute warten.':'Zugangscode stimmt nicht.');token=(await response.json()).token;sessionStorage.setItem('matrixToken',token);$('code').value='';$('message').textContent='';await refresh()}catch(err){$('message').textContent=err.message}};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.body.requestFullscreen()}catch(e){$('connection').textContent='Vollbild nicht verfügbar – am PC alternativ F11 drücken.'}};
async function load(id,large=false){const response=await api('/api/images/'+id+'?large='+large+'&project='+encodeURIComponent(state.projectId)),url=URL.createObjectURL(await response.blob()),image=new Image();try{await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url});return {url,image}}catch(e){URL.revokeObjectURL(url);throw e}}
function draw(){const canvas=$('wall'),ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);if(!state?.projectId)return;const aspect=state.columns*state.tileAspect/state.rows;let width=1200,height=Math.round(width/aspect);if(height>1600){height=1600;width=Math.max(1,Math.round(height*aspect))}canvas.width=width;canvas.height=height;ctx.fillStyle='white';ctx.fillRect(0,0,width,height);if(master)ctx.drawImage(master.image,0,0,width,height);const w=width/state.columns,h=height/state.rows;if(state.mosaicVisible)for(const p of state.photos){const tile=tiles.get(p.id);if(tile)ctx.drawImage(tile.image,p.column*w,p.row*h,w,h)}ctx.strokeStyle='#0f172a88';ctx.lineWidth=1;for(let x=0;x<=state.columns;x++){ctx.beginPath();ctx.moveTo(x*w,0);ctx.lineTo(x*w,height);ctx.stroke()}for(let y=0;y<=state.rows;y++){ctx.beginPath();ctx.moveTo(0,y*h);ctx.lineTo(width,y*h);ctx.stroke()}const p=state.photos.find(p=>p.id===state.currentId);if(p){ctx.fillStyle='#f59e0b66';ctx.fillRect(p.column*w,p.row*h,w,h);ctx.strokeStyle='#f97316';ctx.lineWidth=4;ctx.strokeRect(p.column*w,p.row*h,w,h)}}
function render(){if(!state)return;const selected=state.photos.find(p=>p.id===state.currentId);$('coordinate').textContent=selected?.coordinate||'Bereit';$('remaining').textContent=!state.projectId?'Bitte am Fotobox-PC ein Projekt öffnen':state.remaining===0?'Mosaik vollständig!':state.remaining+' Bilder fehlen noch';$('position').textContent=selected?'Bild '+(state.photos.indexOf(selected)+1)+' von '+state.photos.length+' · Spalte '+(selected.column+1)+', Zeile '+(selected.row+1):'';const loaded=selected&&current===selected.id&&currentUrl;$('photo').hidden=!loaded;$('placeholder').hidden=!!loaded;$('placeholder').textContent=selected?'Bild lädt …':'Warte auf das erste Foto';if(loaded)$('photo').src=currentUrl;draw()}
async function loadCurrent(){const id=state?.currentId;if(!id||current===id||loadingCurrent===id)return;loadingCurrent=id;const version=epoch;try{const loaded=await load(id,true);if(version!==epoch||state?.currentId!==id){URL.revokeObjectURL(loaded.url);return}if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=loaded.url;current=id;render()}catch(e){}finally{if(loadingCurrent===id)loadingCurrent=null}}
async function fill(){if(loadingTiles||!state?.projectId)return;loadingTiles=true;const version=epoch;try{if(!master){const loaded=await load('master');if(version!==epoch){URL.revokeObjectURL(loaded.url);return}master=loaded;draw()}if(state.mosaicVisible)for(const p of state.photos){if(version!==epoch||!state.mosaicVisible)break;if(tiles.has(p.id))continue;try{const tile=await load(p.id);if(version!==epoch){URL.revokeObjectURL(tile.url);break}tiles.set(p.id,tile);draw()}catch(e){}}}catch(e){}finally{loadingTiles=false}}
let refreshing=false;
async function refresh(){if(!token||refreshing)return;refreshing=true;try{state=await (await api('/api/state')).json();if(project!==state.projectId){project=state.projectId;clear()}$('login').hidden=true;$('stage').hidden=false;$('connection').textContent=(state.slideshow?'Diashow läuft':'Live-Präsentation')+' · '+new Date().toLocaleTimeString('de-DE');render();void fill();void loadCurrent()}catch(err){$('connection').textContent='Verbindung unterbrochen · letzter geladener Stand';$('message').textContent=err.message}finally{refreshing=false}}
async function poll(){await refresh();setTimeout(poll,1000)}poll();
</script></body></html>
